<!DOCTYPE html>
<html lang="th" data-ui-page="recipes">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>สูตรสินค้า | CHAIXI BAMEEKIAO POS</title>

    <link rel="stylesheet" href="./css/recipes.css">
    <link rel="stylesheet" href="./css/pro-ui.css?v=3.14.0">
    <link rel="stylesheet" href="./css/pro-ui-remaining-v3.11.css?v=3.11.0">
</head>

<body>

    <header class="topbar">

        <div class="topbar-left">
            <button id="backBtn" class="icon-btn" type="button">
                ←
            </button>

            <div>
                <h1>สูตรสินค้า</h1>
                <small id="branchText">
                    กำลังโหลดสาขา...
                </small>
            </div>
        </div>

        <div class="topbar-right">

            <span id="userName">
                ผู้ใช้งาน
            </span>

            <button id="logoutBtn" class="outline-btn" type="button">
                ออกจากระบบ
            </button>

        </div>

    </header>


    <main class="page">

        <section class="page-header">

            <div>
                <h2>จัดการสูตรสินค้า</h2>
                <p>
                    กำหนดวัตถุดิบที่ใช้ต่อสินค้า 1 หน่วย
                </p>
            </div>

        </section>


        <section class="product-selector-card">

            <div class="field">

                <label for="productSelect">
                    เลือกสินค้า
                </label>

                <select id="productSelect">

                    <option value="">
                        -- เลือกสินค้า --
                    </option>

                </select>

            </div>

        </section>


        <section id="recipeWorkspace" class="recipe-workspace hidden">

            <div class="product-summary">

                <div>
                    <span>สินค้า</span>
                    <strong id="selectedProductName">
                        -
                    </strong>
                </div>

                <div>
                    <span>ราคาขาย</span>
                    <strong id="selectedProductPrice">
                        ฿0.00
                    </strong>
                </div>

                <div>
                    <span>ต้นทุนสูตร</span>
                    <strong id="recipeCost">
                        ฿0.00
                    </strong>
                </div>

                <div>
                    <span>กำไรขั้นต้น</span>
                    <strong id="grossProfit">
                        ฿0.00
                    </strong>
                </div>

            </div>


            <section class="add-recipe-card">

                <h3>
                    เพิ่มวัตถุดิบในสูตร
                </h3>

                <div class="add-grid">

                    <div class="field">

                        <label for="ingredientSelect">
                            วัตถุดิบ
                        </label>

                        <select id="ingredientSelect">

                            <option value="">
                                -- เลือกวัตถุดิบ --
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label for="quantityUsed">
                            จำนวนที่ใช้
                        </label>

                        <input id="quantityUsed" type="number" min="0" step="0.001" placeholder="0">

                    </div>


                    <div class="field">

                        <label>
                            หน่วย
                        </label>

                        <div id="ingredientUnitText" class="unit-display">
                            -
                        </div>

                    </div>


                    <button id="addRecipeBtn" class="primary-btn add-btn" type="button">
                        + เพิ่มในสูตร
                    </button>

                </div>

                <p id="formMessage" class="message"></p>

            </section>


            <section class="recipe-list-card">

                <div class="list-header">

                    <div>
                        <h3>รายการวัตถุดิบในสูตร</h3>

                        <small id="recipeCount">
                            0 รายการ
                        </small>
                    </div>

                </div>


                <div id="loadingState" class="state hidden">
                    กำลังโหลดสูตร...
                </div>


                <div id="emptyState" class="state">
                    ยังไม่มีวัตถุดิบในสูตร
                </div>


                <div id="recipeTableWrap" class="table-wrap hidden">

                    <table>

                        <thead>

                            <tr>
                                <th>วัตถุดิบ</th>
                                <th>จำนวนที่ใช้</th>
                                <th>ต้นทุน/หน่วย</th>
                                <th>ต้นทุน</th>
                                <th class="text-right">จัดการ</th>
                            </tr>

                        </thead>

                        <tbody id="recipeTableBody">
                        </tbody>

                    </table>

                </div>

            </section>

        </section>


        <div id="pageMessage" class="message"></div>

    </main>


    <script type="module" src="./js/recipes.js"></script>

    <script type="module" src="./js/pro-ui.js?v=3.13.0"></script>
</body>

</html>
